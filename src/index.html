<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="/run/wellness-check-in/" />
  <title>Wellness Check-In</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: var(--hub-bg, #f9fafb);
      --surface: var(--hub-surface, #ffffff);
      --border: var(--hub-border, #e5e7eb);
      --border-mid: var(--hub-border, #d1d5db);
      --text: var(--hub-text, #000000);
      --muted: var(--hub-text-muted, #6b7280);
      --accent: var(--hub-primary, #be185d);
      --accent-hover: var(--hub-primary-hover, #9d174d);
      --accent-fg: var(--hub-primary-fg, #ffffff);
      --radius: var(--hub-radius, 12px);
      --green: var(--hub-tint-success-fg, #047857); --green-soft: var(--hub-tint-success, #d1fae5);
      --amber: var(--hub-tint-warning-fg, #b45309); --amber-soft: var(--hub-tint-warning, #fef3c7);
      --red: var(--hub-tint-danger-fg, #b91c1c);   --red-soft: var(--hub-tint-danger, #fee2e2);
      --indigo: var(--hub-tint-info-fg, #4338ca); --indigo-soft: var(--hub-tint-info, #e0e7ff);
      --shadow: 0 1px 3px rgba(15,23,42,.07);
    }
    body {
      min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: var(--hub-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      font-size: var(--hub-font-size, 15px); line-height: 1.5;
    }
    .app { max-width: 720px; margin: 0 auto; padding: 16px 20px 48px; }
    .header h1 { font-size: 1.3rem; }
    .header .subtitle { color: var(--muted); font-size: .85rem; margin-top: 2px; }
    .muted { color: var(--muted); }
    .tiny { font-size: .78rem; }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px;
    }
    .banner { border-radius: var(--radius); padding: 14px 16px; margin: 14px 0; font-size: .9rem; line-height: 1.5; }
    .banner.buy { background: var(--indigo-soft); border: 1px solid var(--hub-tint-info-border, #c7d2fe); color: var(--hub-tint-info-fg, #3730a3); }
    .self-card { border-color: #fbcfe8; background: linear-gradient(180deg, var(--surface), var(--bg)); }
    .self-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .self-head .title { font-weight: 750; font-size: 1.05rem; }
    .mood-row { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
    .mood-btn {
      flex: 1; min-width: 96px; display: flex; flex-direction: column; align-items: center; gap: 4px;
      border: 1.5px solid var(--border-mid); border-radius: var(--radius); background: var(--surface);
      color: var(--text); padding: 12px 8px; cursor: pointer; font: inherit; font-weight: 650;
    }
    .mood-btn .emoji { font-size: 1.6rem; }
    .mood-btn:hover { border-color: var(--accent); }
    .mood-btn:disabled { opacity: .5; cursor: default; }
    .note-input { margin-top: 12px; }
    .status-row { display: flex; align-items: center; gap: 12px; }
    .dot { width: 13px; height: 13px; border-radius: 50%; flex-shrink: 0; }
    .dot.disarmed { background: #9ca3af; }
    .dot.ok { background: #10b981; }
    .dot.due_soon { background: #f59e0b; }
    .dot.overdue { background: #ef4444; }
    .dot.unstarted { background: #6366f1; }
    .board-card { }
    .board-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .board-title { font-weight: 750; }
    .board-meta { color: var(--muted); font-size: .84rem; margin-top: 2px; }
    .pill { display: inline-flex; align-items: center; min-height: 24px; padding: 2px 10px; border-radius: 999px;
      background: var(--bg); color: var(--muted); font-size: .74rem; font-weight: 700; white-space: nowrap; }
    .pill.good { background: var(--green-soft); color: var(--green); }
    .pill.warn { background: var(--amber-soft); color: var(--amber); }
    .pill.bad { background: var(--red-soft); color: var(--red); }
    .pill.info { background: var(--indigo-soft); color: var(--indigo); }
    .streak { margin-top: 10px; font-size: .85rem; }
    .history { margin-top: 10px; display: grid; gap: 6px; }
    .h-item { display: flex; align-items: center; gap: 8px; font-size: .82rem; color: var(--text); }
    .h-item .h-emoji { font-size: 1rem; }
    .h-item .h-when { color: var(--muted); margin-left: auto; white-space: nowrap; }
    .row-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    button {
      font: inherit; border: 1px solid transparent; border-radius: 8px; padding: 9px 14px;
      cursor: pointer; font-weight: 700; min-height: 38px;
    }
    button:disabled { opacity: .5; cursor: default; }
    .btn { background: var(--accent); color: var(--accent-fg); }
    .btn:hover { background: var(--accent-hover); }
    .btn-checkin { background: #10b981; color: #fff; }
    .btn-ghost { background: transparent; color: var(--text); border-color: var(--border-mid); }
    .btn-ghost:hover { background: var(--bg); }
    .btn-danger { background: var(--red-soft); color: var(--red); }
    .btn-sm { min-height: 32px; padding: 5px 10px; font-size: .8rem; }
    label { display: block; font-size: .76rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 800; margin: 12px 0 5px; }
    input, textarea, select {
      width: 100%; border: 1.5px solid var(--border-mid); border-radius: 8px;
      padding: 9px 11px; font: inherit; background: var(--surface); color: var(--text);
    }
    textarea { min-height: 72px; resize: vertical; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
    .recipient { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: .92rem; text-transform: none; letter-spacing: normal; }
    .recipient input { width: 16px; height: 16px; }
    .ext-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0; }
    .ext-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--bg);
      border: 1px solid var(--border); border-radius: 999px; padding: 4px 6px 4px 12px; font-size: .84rem; max-width: 100%; }
    .ext-chip .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ext-chip .badge { font-size: .66rem; font-weight: 700; text-transform: uppercase; padding: 2px 6px; border-radius: 999px; }
    .ext-chip .badge.confirmed { background: var(--green-soft); color: var(--hub-tint-success-fg, #065f46); }
    .ext-chip .badge.pending { background: var(--amber-soft); color: var(--hub-tint-warning-fg, #92400e); }
    .ext-chip .badge.unsubscribed { background: var(--red-soft); color: var(--hub-tint-danger-fg, #991b1b); }
    .ext-chip .x { background: transparent; border: none; padding: 0 2px; min-height: auto; cursor: pointer; color: var(--muted); font-size: 1rem; font-weight: 700; }
    .add-external { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
    .add-external input[type="email"] { flex: 2; min-width: 150px; }
    .add-external input[type="text"] { flex: 1; min-width: 100px; }
    .picker { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .picker .pick { background: transparent; border: 1px dashed var(--border-mid); border-radius: 999px; padding: 4px 12px; min-height: auto; font-size: .82rem; font-weight: 500; color: var(--text); }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: flex; align-items: flex-start; justify-content: center; padding: 24px 14px; overflow-y: auto; z-index: 50; }
    .modal { background: var(--surface); border-radius: var(--radius); box-shadow: 0 20px 50px rgba(15,23,42,.25); padding: 20px; width: 100%; max-width: 520px; }
    .modal h2 { font-size: 1.1rem; margin-bottom: 4px; }
    .actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
    .actions .spacer { flex: 1; }
    .hint { font-size: .8rem; color: var(--muted); margin-top: 4px; }
    .load-error { margin: 0 0 12px; padding: 10px 14px; border-radius: 10px; background: var(--hub-tint-danger, #fee2e2); color: var(--hub-tint-danger-fg, #b91c1c); font-size: 0.9rem; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
    .load-error-retry { background: none; border: 1px solid currentColor; border-radius: 8px; padding: 5px 10px; font: inherit; font-weight: 600; color: inherit; cursor: pointer; flex-shrink: 0; }
    .error { background: var(--red-soft); color: var(--red); padding: 9px 12px; border-radius: 8px; margin: 8px 0; font-size: .86rem; }
    .notice { background: var(--green-soft); color: var(--green); padding: 9px 12px; border-radius: 8px; margin: 8px 0; font-size: .86rem; }
    .empty { text-align: center; color: var(--muted); padding: 26px 14px; }
    .footnote { color: var(--muted); font-size: .8rem; margin-top: 18px; }
    .call-row { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
    .btn-call { width: 100%; min-height: 46px; font-size: 1rem; }
    .req { display: grid; gap: 4px; }
    .req + .req { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border); }
    .req-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .req-title { font-weight: 700; }
    .req-note { font-size: .9rem; }
    .hand-card { border-color: var(--hub-tint-warning-border, #fde68a); }
    details.handled summary { cursor: pointer; font-weight: 700; font-size: .9rem; }
    details.handled .req { margin-top: 10px; }
    @media (max-width: 520px) { .mood-btn { min-width: 0; } }
    .search-row { margin-bottom: 12px; }
    .search-input {
      width: 100%; border: 1.5px solid var(--border-mid, var(--border, #d1d5db));
      border-radius: 8px; padding: 9px 11px; font: inherit;
      background: var(--surface, var(--card, #fff)); color: var(--text, inherit);
    }
    .search-input:focus { outline: none; border-color: var(--accent, #6366f1); }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1><span id="page-glyph"></span> Wellness Check-In</h1>
      <p class="subtitle">A gentle daily “I’m OK”. If a check-in is missed, the care circle is told — and can see who is following up.</p>
    </div>
    <div id="root"><div class="empty">Loading…</div></div>
  </div>

  <script type="module">
    import { esc, isAdult, memberColor, initial, hubAlert, hubConfirm, searchMatch, hubToday, hubTimeZone, sendHubNotification, glyph } from "/hub-sdk.js";
    import {
      MOODS, moodMeta, hoursToDays, daysToHours, intervalLabel, profileStatus,
      formatRemaining, computeStreak, validateConfig, recipientsSummary, profileTitle,
      normalizeEmail, isValidEmail, MAX_PROFILES, MAX_EXTERNAL_RECIPIENTS, searchableFields,
      GRACE_MINUTES, MAX_NOTE_LENGTH, agreedTime, checkinTimesValue, timedAlertValue, reminderTitle,
      formatClock, requestKind, requestState, canClaim, canResolve, canCancel,
      requestStatusLine, sortRequests, validateNote, missedSourceKey, missedCheckins, notifyAudience, knowsRequestAudience, checkinDateFor,
      supervisesCareCircle, canManageProfile, profileSubjects, opensRequestsForOthers, takesOthersRequests,
      inviteFailureLine, failureLine,
    } from "./logic.js";

    document.getElementById("page-glyph").innerHTML = glyph("pulse-heart");

    const T = "app_wellness_check_in__";
    const DB = window.__DB_URL ?? "";
    const CONTEXT = window.__CONTEXT_URL ?? "";
    const APP_ID = window.__APP_ID ?? "wellness-check-in";
    let ME = window.__CURRENT_MEMBER ?? null; // falls back to a demo member when there's no hub context
    const CHECK_IN = `/run/${APP_ID}/api/check-in`;
    const XC_INVITE = window.__EXTERNAL_CONTACTS_INVITE_URL ?? "";
    const XC_LIST = window.__EXTERNAL_CONTACTS_LIST_URL ?? "";

    let members = [];
    let memberMap = new Map();
    let profiles = [];
let searchQ = "";       // in-app search (see logic.js searchableFields)
    let checkins = [];               // rows visible to me: my own, and everyone's for whoever supervises
    let requests = [];               // hand-offs visible to me: my own, and every one for an adult
    let entitled = null;             // null until the endpoint answers
    let externalContacts = new Map();// normalized email → { status, name }
    let externalContactsUnread = false; // the list could not be read: a status is unknown, not "pending"
    let contactsBook = [];           // [{name, email}] quick-adds from contacts app
    let error = "";
    let notice = "";
    let loadFailed = false;          // the board could not be read: it is unknown, not empty
    let noteDraft = "";

    const iAmAdult = () => isAdult(ME, members);
    const EVENTS_URL = window.__EVENTS_URL ?? "/api/events";
    const IS_ADMIN  = window.__IS_ADMIN === true;
    const IS_ROSTER = window.__SPACE_KIND === "roster";
    const TENANT = {
      tenantKind: window.__TENANT_KIND ?? "household",
      spaceKind: window.__SPACE_KIND ?? null,
      isAdmin: IS_ADMIN,
    };
    // Who sees the whole board and adds a profile for someone else: any adult
    // at home, only the steward in a shared space.
    const supervises = () => supervisesCareCircle(ME, TENANT);
    // Requests are the care circle's to share: any adult reads them and may
    // take one, except in a roster, where only the steward does. Picking up a
    // missed check-in opens a request about someone else, which only whoever
    // supervises may do.
    const takesRequests = () => takesOthersRequests(ME, TENANT);
    const takesMissed = () => opensRequestsForOthers(ME, TENANT);
    const canManage = p => canManageProfile(p, ME, TENANT);

    async function db(sql, params = []) {
      if (!DB) return { rows: [] };
      const res = await fetch(DB, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sql, params }),
      });
      const json = await res.json().catch(() => null);
      if (!res.ok || !json || typeof json !== "object" || json.error) throw Object.assign(new Error(json?.error || "Couldn’t reach the hub. Try again."), { status: res.status, code: json?.code });
      return json;
    }

    // A failed write says the line for what happened (failureLine): "try
    // again" only when trying again can work. The hub's own error text goes to
    // the console, never to the page. A read-only space or household keeps a
    // line of its own: the person can do something about it.
    // `words` is { action, thing } in this app's nouns.
    function userError(msg) { return Object.assign(new Error(msg), { forUser: true }); }
    function failText(e, words) {
      if (e?.forUser) return e.message;
      console.error(e);
      if (e?.code === "space_read_only") return `Couldn’t ${words.action}. This space is read-only until its sponsor’s plan is renewed.`;
      if (e?.code === "household_read_only") return `Couldn’t ${words.action}. The household is read-only until its plan is renewed.`;
      return failureLine(e, words);
    }
    // After a profile write that changed nothing: re-read, and say whether the
    // row is still there (undefined when the re-read failed: the outcome is unknown).
    const profileFound = id => loadProfiles().then(() => profiles.some(x => x.id === id), (e) => { console.error(e); return undefined; });
    // The row is already there. The hub names it with a code; one that
    // predates the code says it in SQLite's words.
    const alreadyThere = e => e?.code === "UNIQUE_CONSTRAINT" || /UNIQUE constraint failed/i.test(e?.message ?? "");

    // ── loading ───────────────────────────────────────────────────────────────

    /**
     * Fire-and-forget publish. The coarse mood status travels (every adult can
     * already read it); the member's free-text note never does — the bus is
     * household-wide and reaches automations no one vetted for it.
     */
    async function publishEvent(type, subjectId, payload = {}) {
      if (!EVENTS_URL) return;
      await fetch(EVENTS_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ type, subject_id: subjectId, payload }),
      }).catch(() => {});
    }

    async function loadMembers() {
      if (!CONTEXT) {
        members = [
          { id: "demo-1", name: "Grandpa Joe", role: "adult" },
          { id: "demo-2", name: "Maria", role: "adult" },
          { id: "demo-3", name: "Dev", role: "adult" },
        ];
      } else {
        // A failed read throws: it is a failed load, never a household of nobody.
        const res = await fetch(`${CONTEXT}?keys=family.members`);
        const data = await res.json().catch(() => null);
        if (!res.ok || data === null || typeof data !== "object" || Array.isArray(data)) throw new Error("Couldn’t reach the hub. Try again.");
        // A 200 that names the key in `$errors` is the hub saying it could not read it.
        if (Array.isArray(data.$errors) && data.$errors.includes("family.members")) throw new Error("Couldn’t reach the hub. Try again.");
        members = data["family.members"] ?? [];
      }
      memberMap = new Map(members.map(m => [m.id, m]));
    }

    async function loadProfiles() {
      if (!DB) {
        profiles = [{
          id: "demo-p1", member_id: "demo-1", label: "", active: 1, interval_hours: 24,
          message: "Please call me and swing by the house.", recipient_member_ids: "[]",
          recipient_emails: "[]", last_checkin_at: new Date(Date.now() - 20 * 3600 * 1000).toISOString(),
          last_alerted_at: null, created_at: new Date().toISOString(), updated_at: new Date().toISOString(),
        }];
        return;
      }
      const { rows } = await db(`SELECT * FROM ${T}profiles ORDER BY created_at ASC`);
      profiles = rows ?? [];
    }

    async function loadCheckins() {
      if (!DB) {
        const now = Date.now();
        checkins = [
          { id: "c1", member_id: "demo-1", mood: "good", note: "Slept well.", checked_at: new Date(now - 20 * 3600 * 1000).toISOString() },
          { id: "c2", member_id: "demo-1", mood: "ok", note: "", checked_at: new Date(now - 44 * 3600 * 1000).toISOString() },
        ];
        return;
      }
      const { rows } = await db(`SELECT * FROM ${T}checkins ORDER BY checked_at DESC LIMIT 200`);
      checkins = rows ?? [];
    }

    async function loadRequests() {
      if (!DB) {
        requests = [{
          id: "demo-r1", member_id: "demo-1", kind: "missed_dose", status: "claimed", note: "",
          claimed_by: "demo-2", claimed_at: new Date(Date.now() - 20 * 60000).toISOString(),
          followup_note: "", closed_at: null, source_event_id: "demo", created_at: new Date(Date.now() - 50 * 60000).toISOString(),
        }];
        return;
      }
      // Two reads, because they are bounded for different reasons. Unfinished
      // work is never traded away for history: under one shared limit, enough
      // closed requests would push an open one off the board with no way left
      // to take it. Oldest first, so the cap could only ever drop the newest.
      const [open, handled] = await Promise.all([
        db(`SELECT * FROM ${T}requests WHERE status <> 'done' ORDER BY created_at ASC LIMIT 200`),
        db(`SELECT * FROM ${T}requests WHERE status = 'done' ORDER BY created_at DESC LIMIT 50`),
      ]);
      requests = [...(open.rows ?? []), ...(handled.rows ?? [])];
    }

    // Everything the board derives from, re-read together: a missed check-in is
    // computed from profiles and check-ins, so refreshing requests alone would
    // keep offering one the person has since answered from another device.
    async function refreshBoard() {
      await Promise.all([loadProfiles(), loadCheckins(), loadRequests()]);
    }

    async function loadEntitlement() {
      try {
        const res = await fetch(CHECK_IN);
        if (!res.ok) { entitled = null; return; }
        entitled = !!(await res.json()).entitled;
      } catch { entitled = null; }
    }

    async function loadExternalContacts() {
      externalContacts = new Map();
      externalContactsUnread = false;
      if (!XC_LIST) return;
      // Optional, so a failure never raises the banner — but it is remembered,
      // so a confirmed contact is not then drawn as "Pending".
      try {
        const res = await fetch(XC_LIST, { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
        if (!res.ok) { externalContactsUnread = true; return; }
        const { contacts } = await res.json();
        for (const c of contacts ?? []) externalContacts.set(normalizeEmail(c.email), { status: c.status, name: c.name || "" });
      } catch { externalContactsUnread = true; }
    }

    async function loadContactsBook() {
      contactsBook = [];
      try {
        const res = await fetch(`${CONTEXT}?keys=app.contacts.contact_emails`);
        const list = (await res.json())["app.contacts.contact_emails"];
        if (Array.isArray(list)) {
          contactsBook = list.filter(c => c && isValidEmail(c.email))
            .map(c => ({ name: String(c.name || "").trim(), email: normalizeEmail(c.email) }));
        }
      } catch { contactsBook = []; }
    }

    // ── derived ─────────────────────────────────────────────────────────────

    function memberName(id) { return memberMap.get(id)?.name ?? "Someone"; }
    function myProfile() { return profiles.find(p => p.member_id === ME?.id) ?? null; }
    function checkinsFor(memberId) { return checkins.filter(c => c.member_id === memberId); }
    // "" when the status is not known (the list could not be read): no badge.
    function contactStatus(email) {
      const known = externalContacts.get(normalizeEmail(email))?.status;
      return known ?? (externalContactsUnread ? "" : "pending");
    }
    function contactName(email) {
      const norm = normalizeEmail(email);
      return externalContacts.get(norm)?.name || contactsBook.find(c => c.email === norm)?.name || "";
    }
    function profileFor(memberId) { return profiles.find(p => p.member_id === memberId) ?? null; }
    function missedNow() {
      return missedCheckins(profiles, checkins, requests, {
        today: hubToday(), now: Date.now(), timeZone: hubTimeZone(), dayOf: iso => hubToday(new Date(iso)),
      });
    }
    function fmtAgo(iso) {
      if (!iso) return "never";
      const ms = Date.now() - Date.parse(iso);
      if (Number.isNaN(ms)) return "never";
      if (ms < 60000) return "just now";
      return `${formatRemaining(ms)} ago`;
    }

    // ── rendering ─────────────────────────────────────────────────────────────

    const STATE_PILL = {
      ok: ["good", "On track"], due_soon: ["warn", "Due soon"], overdue: ["bad", "Overdue"],
      unstarted: ["info", "Waiting for first check-in"], disarmed: ["", "Paused"],
    };

    function renderMessages() {
      return `${error ? `<div class="error">${esc(error)}</div>` : ""}${notice ? `<div class="notice">${esc(notice)}</div>` : ""}`;
    }

    function renderBanner() {
      if (entitled !== false) return "";
      return `<div class="banner buy">${glyph("lock")} <strong>Monitoring isn’t active for your household yet.</strong>
        Monitoring and alert emails are included with every plan, but they pause while the household's
        subscription is inactive. A household admin can renew from <strong>Settings → Billing</strong>.</div>`;
    }

    function renderSelfCard() {
      const p = myProfile();
      if (!p) return "";
      const status = profileStatus(p);
      const streak = computeStreak(checkinsFor(ME.id));
      const [cls, label] = STATE_PILL[status.state] ?? ["", ""];
      const disabled = entitled === false;
      return `
        <div class="card self-card">
          <div class="self-head">
            <div class="title">Your check-in</div>
            <span class="pill ${cls}">${esc(label)}</span>
          </div>
          <p class="board-meta">${statusDetail(p, status)}</p>
          ${streak > 0 ? `<div class="streak">${glyph("flame")} <strong>${streak}-day</strong> streak — keep it going.</div>` : ""}
          <div class="mood-row">
            ${MOODS.map(m => `
              <button class="mood-btn" data-checkin-mood="${esc(m.key)}" ${disabled ? "disabled" : ""}>
                <span class="emoji">${esc(m.emoji)}</span>${esc(m.label)}
              </button>`).join("")}
          </div>
          <div class="note-input">
            <textarea id="note-draft" maxlength="500" placeholder="Add a note for your care circle (optional)">${esc(noteDraft)}</textarea>
          </div>
          <p class="hint">One tap resets your clock and lets everyone know you’re OK.</p>
          ${renderSelfRequests()}
        </div>`;
    }

    // What the person sees about themselves: the call button, and who has
    // picked up anything raised for them. They read it; relatives act on it.
    function renderSelfRequests() {
      const mine = sortRequests(requests.filter(r => r.member_id === ME.id && requestState(r) !== "done"));
      const callOut = mine.some(r => r.kind === "call");
      const lastDone = requests.find(r => r.member_id === ME.id && requestState(r) === "done"
        && Date.now() - Date.parse(r.closed_at) < 24 * 3600 * 1000);
      return `
        <div class="call-row">
          ${mine.map(r => `
            <div class="req">
              <div class="req-head">
                <span class="req-title">${glyph(requestKind(r.kind).glyph)} ${esc(r.kind === "call" ? "You asked for a call" : `Your ${requestKind(r.kind).label}`)}</span>
                <span class="pill ${requestState(r) === "claimed" ? "good" : "warn"}">${esc(requestStatusLine(r, memberName))}</span>
              </div>
              ${canCancel(r, ME.id) ? `<div class="row-actions" style="margin-top:6px"><button class="btn-ghost btn-sm" data-req-cancel="${esc(r.id)}">Never mind</button></div>` : ""}
            </div>`).join("")}
          ${lastDone ? `
            <div class="req">
              <p class="board-meta">${glyph("tick")} ${esc(requestStatusLine(lastDone, memberName))} ${esc(fmtAgo(lastDone.closed_at))}</p>
              ${lastDone.followup_note ? `<div class="req-note">${esc(lastDone.followup_note)}</div>` : ""}
            </div>` : ""}
          ${callOut ? "" : `<div class="row-actions"><button class="btn-ghost btn-call" data-req-call>${glyph("phone")} Request a family call</button></div>`}
        </div>`;
    }

    // The relatives' side: everything that still needs someone, unclaimed first.
    function renderNeedsAHand() {
      const open = sortRequests(requests.filter(r => r.member_id !== ME.id && requestState(r) !== "done"));
      // Whoever supervises reads the profiles a missed check-in is worked out
      // from, so they see it even where they cannot take it (co-parenting).
      const missed = supervises() ? missedNow().filter(m => m.profile.member_id !== ME.id) : [];
      const handled = requests.filter(r => r.member_id !== ME.id && requestState(r) === "done").slice(0, 5);
      if (!open.length && !missed.length && !handled.length) return "";
      return `
        ${open.length || missed.length ? `
          <div class="board-head" style="margin: 6px 2px 10px"><h2 style="font-size:1rem">Needs a hand</h2></div>
          <div class="card hand-card" data-testid="needs-a-hand">
            ${missed.map(renderMissedItem).join("")}
            ${open.map(renderRequestItem).join("")}
          </div>` : ""}
        ${handled.length ? `
          <details class="card handled">
            <summary>Recently handled (${handled.length})</summary>
            ${handled.map(renderRequestItem).join("")}
          </details>` : ""}`;
    }

    function renderMissedItem({ profile: p, reason, date }) {
      const why = reason === "agreed"
        ? `Agreed time was ${formatClock(agreedTime(p))}${date === hubToday() ? "" : " yesterday"} · last check-in ${fmtAgo(p.last_checkin_at)}`
        : `No check-in for ${formatRemaining(Date.now() - Date.parse(p.last_checkin_at))} · expected ${intervalLabel(p.interval_hours)}`;
      return `
        <div class="req">
          <div class="req-head">
            <span class="req-title">⏰ ${esc(memberName(p.member_id))} hasn’t checked in</span>
            <span class="pill warn">Unclaimed</span>
          </div>
          <div class="board-meta">${esc(why)}</div>
          ${takesMissed() ? `<div class="row-actions" style="margin-top:6px"><button class="btn btn-sm" data-testid="claim-missed" data-profile-id="${esc(p.id)}" data-req-claim-missed="${esc(p.id)}">I’ve got this</button></div>` : ""}
        </div>`;
    }

    function renderRequestItem(r) {
      const state = requestState(r);
      const kind = requestKind(r.kind);
      const pill = state === "open" ? ["warn", "Unclaimed"]
        : state === "claimed" ? ["good", r.claimed_by === ME.id ? "You’re handling this" : `${memberName(r.claimed_by)} is handling this`]
        : ["", r.claimed_by === ME.id ? "You followed up" : `${memberName(r.claimed_by)} followed up`];
      return `
        <div class="req" data-testid="request" data-request-id="${esc(r.id)}" data-request-state="${esc(state)}">
          <div class="req-head">
            <span class="req-title">${glyph(kind.glyph)} ${esc(kind.headline(memberName(r.member_id)))}</span>
            <span class="pill ${pill[0]}">${esc(pill[1])}</span>
          </div>
          <div class="board-meta">${esc(fmtAgo(state === "done" ? r.closed_at : r.created_at))}</div>
          ${r.note ? `<div class="req-note">“${esc(r.note)}”</div>` : ""}
          ${r.followup_note ? `<div class="req-note">${esc(r.followup_note)}</div>` : ""}
          ${canClaim(r, ME.id, takesRequests()) || canResolve(r, ME.id) ? `
            <div class="row-actions" style="margin-top:6px">
              ${canClaim(r, ME.id, takesRequests()) ? `<button class="btn btn-sm" data-testid="claim-request" data-request-id="${esc(r.id)}" data-req-claim="${esc(r.id)}">I’ve got this</button>` : ""}
              ${canResolve(r, ME.id) ? `
                <button class="btn btn-sm" data-req-close="${esc(r.id)}">Record follow-up</button>
                <button class="btn-ghost btn-sm" data-req-release="${esc(r.id)}">Hand back</button>` : ""}
            </div>` : ""}
        </div>`;
    }

    function statusDetail(p, status) {
      return `${windowDetail(p, status)}${agreedDetail(p)}`;
    }

    function agreedDetail(p) {
      const time = agreedTime(p);
      if (!time || Number(p.active) !== 1) return "";
      return ` Agreed time ${esc(formatClock(time))}: a reminder then, and the care circle hears ${GRACE_MINUTES} minutes later if there’s still no check-in.`;
    }

    function windowDetail(p, status) {
      const who = recipientsSummary(JSON.parse(p.recipient_member_ids || "[]"), members, p.member_id, JSON.parse(p.recipient_emails || "[]"));
      if (status.state === "disarmed") return "Monitoring is paused.";
      if (status.state === "unstarted") return `Monitoring is on (${esc(intervalLabel(p.interval_hours))}) — waiting for the first check-in.`;
      if (status.state === "overdue") return `No check-in for ${esc(formatRemaining(status.overdueMs + p.interval_hours * 3600 * 1000))}. Alerts go to ${esc(who)}.`;
      return `Next check-in due in ${esc(formatRemaining(status.remainingMs))} (${esc(intervalLabel(p.interval_hours))}). Alerts go to ${esc(who)}.`;
    }

    function renderBoardCard(p) {
      const status = profileStatus(p);
      const [cls, label] = STATE_PILL[status.state] ?? ["", ""];
      const streak = computeStreak(checkinsFor(p.member_id));
      const all = checkinsFor(p.member_id);
      const recent = searchQ
        ? all.filter(c => searchMatch(searchQ, [c.note ?? "", c.mood ?? ""]))
        : all.slice(0, 3);
      const isSelf = p.member_id === ME?.id;
      return `
        <div class="card board-card" data-testid="board-card" data-profile-id="${esc(p.id)}" data-pid="${esc(p.id)}">
          <div class="board-head">
            <div>
              <div class="board-title">${esc(profileTitle(p, members))}</div>
              <div class="board-meta">${esc(isSelf ? "You" : memberName(p.member_id))} · last check-in ${esc(fmtAgo(p.last_checkin_at))}${agreedTime(p) ? ` · agreed time ${esc(formatClock(agreedTime(p)))}` : ""}</div>
            </div>
            <span class="pill ${cls}">${esc(label)}</span>
          </div>
          ${streak > 0 ? `<div class="streak">${glyph("flame")} ${streak}-day streak</div>` : ""}
          ${recent.length ? `<div class="history">${recent.map(renderHistoryItem).join("")}</div>` : `<p class="board-meta" style="margin-top:8px">No check-ins logged yet.</p>`}
          ${canManage(p) ? `
            <div class="row-actions">
              <button class="btn-ghost btn-sm" data-edit="${esc(p.id)}">Settings</button>
              ${Number(p.active) === 1
                ? `<button class="btn-ghost btn-sm" data-disarm="${esc(p.id)}">Pause</button>`
                : `<button class="btn btn-sm" data-arm="${esc(p.id)}">Start monitoring</button>`}
              <button class="btn-danger btn-sm" data-delete="${esc(p.id)}">Delete</button>
            </div>` : ""}
        </div>`;
    }

    function renderHistoryItem(c) {
      const m = moodMeta(c.mood);
      return `<div class="h-item">
        <span class="h-emoji">${esc(m ? m.emoji : "✓")}</span>
        <span>${c.note ? esc(c.note) : esc(m ? m.label : "Checked in")}</span>
        <span class="h-when">${esc(fmtAgo(c.checked_at))}</span>
      </div>`;
    }

    // render() rewrites the whole view, so put the caret back after typing.
    document.addEventListener("input", (e) => {
      if (e.target.id !== "search") return;
      searchQ = e.target.value;
      const caret = e.target.selectionStart;
      render();
      const next = document.getElementById("search");
      if (next) { next.focus(); next.setSelectionRange(caret, caret); }
    });

    function render() {
      const root = document.getElementById("root");
      if (!ME) { root.innerHTML = `<div class="card empty">Sign in to use Wellness Check-In.</div>`; return; }
      if (loadFailed) {
        root.innerHTML = `<div class="load-error" data-testid="load-error" role="alert"><span>Couldn’t load the check-ins.</span> <button type="button" class="load-error-retry" data-testid="load-retry">Try again</button></div>`;
        return;
      }
      // A search keeps a card when the person matches OR anything they have
      // written does, so typing a symptom surfaces who reported it.
      const others = searchQ
        ? profiles.filter(p => searchMatch(searchQ, searchableFields(
            p, memberName(p.member_id), checkinsFor(p.member_id).map(c => c.note ?? "").join(" "))))
        : profiles;
      // Someone who doesn't supervise may still set up their own check-in.
      const addSelf = !supervises() && membersWithoutProfile().length > 0;
      root.innerHTML = `
        ${renderBanner()}
        ${renderMessages()}
        ${renderSelfCard()}
        ${renderNeedsAHand()}
        <div class="board-head" style="margin: 6px 2px 10px">
          <h2 style="font-size:1rem">Care circle</h2>
          ${supervises()
            ? `<button class="btn btn-sm" data-testid="add-profile" data-scope="anyone" data-add ${profiles.length >= MAX_PROFILES ? "disabled" : ""}>+ Add someone</button>`
            : addSelf ? `<button class="btn btn-sm" data-testid="add-profile" data-scope="self" data-add>+ Add yourself</button>` : ""}
        </div>
        ${TENANT.tenantKind === "shared_space" && !supervises() ? `<p class="hint" data-testid="scope-note">${IS_ROSTER ? "Here, the steward sees everyone’s check-ins and takes requests." : "In a shared space, the steward sees everyone’s check-ins. Any adult can take a request."}</p>` : ""}
        ${profiles.length ? `<div class="search-row"><input id="search" class="search-input" type="search" placeholder="Search the care circle…" aria-label="Search the care circle" value="${esc(searchQ)}" /></div>` : ""}
        ${others.length
          ? others.map(renderBoardCard).join("")
          : searchQ
            ? `<div class="card empty">Nobody matches "${esc(searchQ)}".</div>`
            : `<div class="card empty">No check-in profiles yet.${supervises() ? " Add someone to start." : addSelf ? " Add yourself to start." : ""}</div>`}
        <p class="footnote">Alerts are emailed to household members and to external contacts who confirmed by email (double opt-in).
          Monitoring runs on the hub’s servers — it works even when nobody has the app open.</p>`;
    }

    function flash({ err = "", ok = "" } = {}) { error = err; notice = ok; render(); }

    // ── check-in ────────────────────────────────────────────────────────────

    async function doCheckIn(mood) {
      const p = myProfile();
      if (!p) return;
      const note = (document.getElementById("note-draft")?.value ?? "").trim();
      // 1. Authoritative: stamp last_checkin_at on all of my profiles via the hub.
      let res;
      try {
        res = await fetch(CHECK_IN, { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
      } catch { return flash({ err: "Couldn’t reach the check-in service. Try again." }); }
      if (res.status === 402) { entitled = false; return flash({ err: "Monitoring is paused while the household's plan is inactive — ask an admin to renew." }); }
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        console.error("check-in failed", res.status, data.error);
        if (res.status === 404) await loadProfiles().catch(() => {});
        return flash({ err: res.status === 404
          ? "Couldn’t check in. No check-in is set up for you any more — ask whoever set it up to take a look."
          : "Couldn’t check in — try again." });
      }
      entitled = true;
      // 2. Optimistically reflect the check-in locally — the hub already reset the
      //    timer, so patch state instead of round-tripping the whole board.
      const now = new Date().toISOString();
      const idx = profiles.findIndex(x => x.id === p.id);
      if (idx !== -1) profiles[idx] = { ...profiles[idx], last_checkin_at: now };
      // checkin_date is the HOUSEHOLD's day the check-in answers (last night's,
      // inside a late agreed time's grace) and slot the agreed time: together
      // with profile_id they are what the hub matches to see that today's agreed
      // check-in happened, so it neither reminds nor tells the care circle.
      const row = {
        id: crypto.randomUUID(), member_id: ME.id, mood, note, checked_at: now,
        profile_id: p.id, slot: agreedTime(p) ?? "",
        checkin_date: checkinDateFor(p, hubToday(), Date.now(), hubTimeZone()),
      };
      checkins = [row, ...checkins];
      noteDraft = "";
      flash({ ok: "Checked in — thanks for letting everyone know." });
      // 3. Persist the history row (owner_only forces member_id to me). The
      //    silence window already reset above; with an agreed time this row is
      //    also what stands the reminder down, so a failure there is said out
      //    loud — the cost of staying quiet is a false alarm to the family.
      if (DB) {
        db(`INSERT INTO ${T}checkins (id, member_id, mood, note, checked_at, profile_id, checkin_date, slot) VALUES (?, ?, ?, ?, ?, ?, ?, ?)`,
          [row.id, row.member_id, row.mood, row.note, row.checked_at, row.profile_id, row.checkin_date, row.slot])
          .catch(() => {
            if (row.slot) flash({ err: "You’re checked in, but today’s reminder didn’t get the message. Tap again so nobody is alerted by mistake." });
          });
      }
      // Deliberately excludes `note`.
      publishEvent("wellness.checkin_submitted", ME.id, {
        member_id: ME.id,
        mood: row.mood,
        checked_at: row.checked_at,
      });
    }

    // ── requests: ask, take, hand back, follow up ─────────────────────────────

    // Ids only on the bus, never the note: it is household-wide and reaches
    // automations nobody vetted for a person's own words.
    function announce(type, r) {
      publishEvent(type, r.member_id, { member_id: r.member_id, request_id: r.id, kind: r.kind });
    }

    // Not sent when the sender cannot tell who it is for (see
    // knowsRequestAudience): a relative taking part in a shared space cannot
    // read the profile, and the board is what shows everyone their change.
    //
    // The profiles are read again first: who is chosen may have changed since
    // this page last looked, and a notice must not go to a relative who was
    // taken off the list. If that read fails, nothing is sent.
    async function tell(r, title, body, key) {
      if (!DB) return;
      try { await loadProfiles(); } catch { return; }
      const profile = profileFor(r.member_id);
      if (!knowsRequestAudience(profile, supervises())) return;
      const audience = notifyAudience(profile, ME.id, iAmAdult());
      // The sender was the only relative chosen: nobody else is to be told.
      if (Array.isArray(audience) && !audience.length) return;
      sendHubNotification({
        title, body,
        audience,
        url: `/run/${APP_ID}`,
        idempotencyKey: `${APP_ID}:${key}:${r.id}`,
      });
    }

    // Keyed on the claim, not only the request: the hub replays a repeated key
    // without sending, and the same relative can take a request, hand it back
    // and take it again.
    function tellClaimed(r) {
      tell(r, `${ME.name ?? "Someone"} is handling it`, `${requestKind(r.kind).headline(memberName(r.member_id))}.`, `claimed:${Date.parse(r.claimed_at) || 0}`);
    }

    function openCallForm() {
      openModal(`
        <h2>Request a family call</h2>
        <p class="hint">Your care circle is told right away, and you’ll see here who is going to call.</p>
        <div class="error" data-el="error" hidden></div>
        <label for="rq-note">Anything they should know? (optional)</label>
        <textarea id="rq-note" maxlength="${MAX_NOTE_LENGTH}" placeholder="e.g. Nothing urgent, I’d just like to talk."></textarea>
        <div class="actions">
          <button class="btn" data-action="send-call">Ask for a call</button>
          <span class="spacer"></span>
          <button class="btn-ghost" data-action="cancel" type="button">Cancel</button>
        </div>`);
    }

    let sendingCall = false;
    // One id until a request is known to be sent, however many taps or forms
    // it takes: a retry after a lost answer then meets its own row instead of
    // adding a second.
    let pendingCallId = null;
    async function requestCall() {
      if (sendingCall) return;
      const note = modalEl.querySelector("#rq-note").value.trim();
      const err = validateNote(note);
      if (err) return modalError(err);
      sendingCall = true;
      const retry = !!pendingCallId;
      pendingCallId ??= crypto.randomUUID();
      const r = {
        id: pendingCallId, member_id: ME.id, kind: "call", status: "open", note,
        claimed_by: null, claimed_at: null, followup_note: "", closed_at: null,
        source_event_id: null, created_at: new Date().toISOString(),
      };
      try {
        await db(`INSERT INTO ${T}requests (id, member_id, kind, status, note, opened_on, created_at) VALUES (?, ?, 'call', 'open', ?, ?, ?)`,
          [r.id, r.member_id, r.note, hubToday(), r.created_at]);
      } catch (e) {
        // The insert can land and its answer be lost: look before saying it
        // failed. If the board can't be read either, the id being there
        // already says an earlier try landed.
        await loadRequests().catch(() => {});
        const landed = requests.find(x => x.id === r.id);
        if (!landed && !(retry && alreadyThere(e))) {
          sendingCall = false;
          return modalError(failText(e, { action: "send the request", thing: "request" }));
        }
        if (landed) {
          // What landed is what relatives see, so that is what gets announced,
          // with the note as it reads now if the row will still take it.
          Object.assign(r, landed);
          if (requestState(r) !== "open") {
            sendingCall = false;
            pendingCallId = null;
            closeModal();
            render();
            announce("wellness.call_requested", r);
            return flash({ ok: "Your request is on the board, and someone already has it." });
          }
          if (r.note !== note) {
            try {
              const res = await db(`UPDATE ${T}requests SET note = ? WHERE id = ? AND status = 'open'`, [note, r.id]);
              if (res.changed) r.note = note;
            } catch (e2) { console.error(e2); }
          }
        } else {
          // The row is there but can't be read, so its note is unknown. Only a
          // note the row is seen to take may be shown and sent to relatives.
          let kept = false;
          try {
            kept = !!(await db(`UPDATE ${T}requests SET note = ? WHERE id = ? AND status = 'open'`, [note, r.id])).changed;
          } catch (e2) { console.error(e2); }
          if (!kept) {
            sendingCall = false;
            return modalError("Couldn’t send the request — try again.");
          }
        }
      }
      sendingCall = false;
      pendingCallId = null;
      requests = [r, ...requests.filter(x => x.id !== r.id)];
      closeModal();
      render();   // the request shows at once; the line about who was told follows the send
      // Who is chosen may have changed since this page last looked; if the
      // profile cannot be read now, the request is on the board but nobody is
      // pushed, and the person is told that rather than that they were.
      let known = true;
      if (DB) { try { await loadProfiles(); } catch { known = false; } }
      announce("wellness.call_requested", r);
      // The reason is the person's own words: previews off (the default) show
      // the generic line on a locked screen, the inbox shows the rest.
      const audience = notifyAudience(myProfile(), ME.id, iAmAdult());
      const anyone = !(Array.isArray(audience) && !audience.length);
      const sent = !DB || (known && anyone && !!(await sendHubNotification({
        title: `${ME.name ?? "Someone"} would like a call`,
        body: r.note || "Open Wellness Check-In to say you’ve got it.",
        generic: r.note ? { body: "Open Wellness Check-In to say you’ve got it." } : undefined,
        audience,
        url: `/run/${APP_ID}`,
        idempotencyKey: `${APP_ID}:call:${r.id}`,
      })));
      flash({ ok: sent ? "Your care circle has been asked to call."
        : anyone ? "Your request is on the board. We couldn’t notify your care circle just now."
        : "Your request is on the board for your care circle to see." });
    }

    async function cancelRequest(id) {
      try {
        const res = await db(`DELETE FROM ${T}requests WHERE id = ? AND status = 'open'`, [id]);
        // Zero rows means it stopped being open first: someone claimed it.
        const gone = !DB || res.changed > 0;
        // The write has landed; a failed re-read must not report it as failed.
        await loadRequests().catch(() => { if (gone) requests = requests.filter(x => !(x.id === id && requestState(x) === "open")); });
        if (!gone && requests.some(x => x.id === id)) return flash({ err: "Someone has already picked this up, so it can’t be withdrawn." });
        flash({ ok: "Call request withdrawn." });
      } catch (e) { flash({ err: failText(e, { action: "withdraw the request", thing: "request" }) }); }
    }

    // Two relatives can tap at the same moment. The WHERE lets exactly one of
    // them win; a refused write still answers 200, so `changed` is the answer.
    async function claimRequest(id) {
      const now = new Date().toISOString();
      try {
        const res = await db(
          `UPDATE ${T}requests SET status = 'claimed', claimed_by = ?, claimed_at = ?
           WHERE id = ? AND (status = 'open' OR (status = 'claimed' AND claimed_by IS NULL))`,
          [ME.id, now, id]);
        // The claim has landed or not by now; a failed re-read must not hide
        // which, or swallow the announcement of one that did.
        await loadRequests().catch(() => {});
        const r = requests.find(x => x.id === id);
        if (DB && !res.changed) {
          return flash({ err: r && requestState(r) !== "open"
            ? `${memberName(r.claimed_by)} already has this one.` : "That request is no longer open." });
        }
        // If the re-read failed the row here is the old one: mark it taken, so
        // the board stops offering it and the notice is keyed on this claim.
        if (r && r.claimed_by !== ME.id) Object.assign(r, { status: "claimed", claimed_by: ME.id, claimed_at: now });
        flash({ ok: "It’s yours. Record what happened when you’ve followed up." });
        if (r) {
          announce("wellness.request_claimed", r);
          tellClaimed(r);
        }
      } catch (e) { flash({ err: failText(e, { action: "take the request", thing: "request" }) }); }
    }

    // A missed check-in has no row until someone takes it. The source key is
    // unique, so a second relative's insert is refused rather than doubled.
    async function claimMissed(profileId) {
      // Decide on what is true now, not on what was true when the board was
      // drawn: they may have checked in, or someone else may have taken it.
      try { await refreshBoard(); } catch { return flash({ err: "Couldn’t reach the hub. Try again." }); }
      const missed = missedNow().find(m => m.profile.id === profileId);
      if (!missed) return flash({ ok: "No need — that check-in is no longer missed." });
      const p = missed.profile;
      const now = new Date().toISOString();
      const r = {
        id: crypto.randomUUID(), member_id: p.member_id, kind: "missed_checkin", status: "claimed",
        claimed_by: ME.id, claimed_at: now, source_event_id: missedSourceKey(p.id, missed.date),
      };
      try {
        await db(`INSERT INTO ${T}requests (id, member_id, kind, status, claimed_by, claimed_at, source_event_id, opened_on, created_at) VALUES (?, ?, 'missed_checkin', 'claimed', ?, ?, ?, ?, ?)`,
          [r.id, r.member_id, r.claimed_by, now, r.source_event_id, hubToday(), now]);
      } catch (e) {
        await loadRequests().catch(() => {});
        // The unique source key is what refuses a second relative; anything
        // else is a real failure and is reported as itself.
        const landed = requests.find(x => x.source_event_id === r.source_event_id);
        // The insert can land and its answer be lost: then the row is this
        // member's own, and it is theirs, not someone else's.
        if (!(landed && landed.id === r.id)) {
          const taken = !!landed || alreadyThere(e);
          return flash({ err: taken ? "Someone else just took this one." : failText(e, { action: "take this one", thing: "request" }) });
        }
      }
      await loadRequests().catch(() => {});
      flash({ ok: "It’s yours. Record what happened when you’ve followed up." });
      announce("wellness.request_claimed", r);
      tellClaimed(r);
    }

    async function releaseRequest(id) {
      try {
        const res = await db(
          `UPDATE ${T}requests SET status = 'open', claimed_by = NULL, claimed_at = NULL
           WHERE id = ? AND status = 'claimed' AND claimed_by = ?`, [id, ME.id]);
        // The hand-back has landed or not by now; a failed re-read must not
        // hide which, or swallow the announcement of one that did.
        await loadRequests().catch(() => {});
        if (DB && !res.changed) return flash({ err: "That request isn’t yours to hand back any more." });
        const r = requests.find(x => x.id === id);
        if (r && r.claimed_by === ME.id) Object.assign(r, { status: "open", claimed_by: null, claimed_at: null });
        flash({ ok: "Handed back — it’s open for someone else." });
        if (r) {
          announce("wellness.request_released", r);
          // Keyed on the moment: the same request can be handed back twice.
          tell(r, "Still needs someone", `${requestKind(r.kind).headline(memberName(r.member_id))}, and ${ME.name ?? "a relative"} can’t take it after all.`, `released:${Date.now()}`);
        }
      } catch (e) { flash({ err: failText(e, { action: "hand the request back", thing: "request" }) }); }
    }

    function openFollowUp(id) {
      const r = requests.find(x => x.id === id);
      if (!r) return;
      openModal(`
        <h2>Record follow-up</h2>
        <p class="hint">${esc(requestKind(r.kind).headline(memberName(r.member_id)))}. What happened? The care circle and ${esc(memberName(r.member_id))} can read this.</p>
        <div class="error" data-el="error" hidden></div>
        <label for="rq-follow">Follow-up note</label>
        <textarea id="rq-follow" maxlength="${MAX_NOTE_LENGTH}" placeholder="e.g. Called at 2:15, all fine — the phone was in another room."></textarea>
        <div class="actions">
          <button class="btn" data-action="save-follow" data-id="${esc(r.id)}">Mark as followed up</button>
          <span class="spacer"></span>
          <button class="btn-ghost" data-action="cancel" type="button">Cancel</button>
        </div>`);
    }

    async function closeRequest(id) {
      const note = modalEl.querySelector("#rq-follow").value.trim();
      const err = validateNote(note, { required: true });
      if (err) return modalError(err);
      const closedAt = new Date().toISOString();
      try {
        const res = await db(
          `UPDATE ${T}requests SET status = 'done', followup_note = ?, closed_at = ?
           WHERE id = ? AND status = 'claimed' AND claimed_by = ?`,
          [note, closedAt, id, ME.id]);
        await loadRequests().catch(() => {});
        closeModal();
        if (DB && !res.changed) return flash({ err: "That request isn’t yours to close any more." });
        const r = requests.find(x => x.id === id);
        if (r && r.status !== "done") Object.assign(r, { status: "done", followup_note: note, closed_at: closedAt });
        flash({ ok: "Follow-up recorded." });
        if (r) announce("wellness.request_closed", r);
      } catch (e) { modalError(failText(e, { action: "record the follow-up", thing: "request" })); }
    }

    // ── arm / disarm / delete ─────────────────────────────────────────────────

    async function armProfile(id) {
      if (!canManage(profiles.find(x => x.id === id))) return;
      if (entitled === false) return flash({ err: "Monitoring is paused while the household's plan is inactive — ask an admin to renew." });
      try {
        const res = await db(`UPDATE ${T}profiles SET active = 1, updated_at = ? WHERE id = ?`, [new Date().toISOString(), id]);
        if (DB && !res.changed) throw userError(failureLine(null, { action: "start monitoring", thing: "check-in", found: await profileFound(id) }));
        // The write has landed; a failed re-read must not report it as failed.
        await loadProfiles().catch(() => { const p = profiles.find(x => x.id === id); if (p) p.active = 1; });
        flash({ ok: "Monitoring started. The clock begins at the first check-in." });
      } catch (e) { flash({ err: failText(e, { action: "start monitoring", thing: "check-in" }) }); }
    }

    async function disarmProfile(id) {
      if (!canManage(profiles.find(x => x.id === id))) return;
      try {
        const res = await db(`UPDATE ${T}profiles SET active = 0, updated_at = ? WHERE id = ?`, [new Date().toISOString(), id]);
        if (DB && !res.changed) throw userError(failureLine(null, { action: "pause monitoring", thing: "check-in", found: await profileFound(id) }));
        await loadProfiles().catch(() => { const p = profiles.find(x => x.id === id); if (p) p.active = 0; });
        flash({ ok: "Monitoring paused." });
      } catch (e) { flash({ err: failText(e, { action: "pause monitoring", thing: "check-in" }) }); }
    }

    async function deleteProfile(id) {
      const p = profiles.find(x => x.id === id);
      if (!canManage(p)) return;
      if (!(await hubConfirm({ message: `Delete ${profileTitle(p, members)}?`, description: "Monitoring stops immediately. Check-in history is kept.", confirmLabel: "Delete", destructive: true }))) return;
      try {
        const res = await db(`DELETE FROM ${T}profiles WHERE id = ?`, [id]);
        if (DB && !res.changed) {
          // Nothing removed and still there: refused. Gone: an earlier try landed.
          await loadProfiles();
          if (profiles.some(x => x.id === id)) throw userError(failureLine(null, { action: "delete the profile", thing: "check-in", found: true }));
        } else {
          await loadProfiles().catch(() => { profiles = profiles.filter(x => x.id !== id); });
        }
        flash({ ok: "Profile deleted." });
      } catch (e) { flash({ err: failText(e, { action: "delete the profile", thing: "check-in" }) }); }
    }

    // ── config modal (add / edit) ─────────────────────────────────────────────

    let modalEl = null;
    function closeModal() { modalEl?.remove(); modalEl = null; }
    function openModal(html) {
      closeModal();
      modalEl = document.createElement("div");
      modalEl.className = "modal-backdrop";
      modalEl.innerHTML = `<div class="modal">${html}</div>`;
      modalEl.addEventListener("click", e => { if (e.target === modalEl) closeModal(); });
      document.body.appendChild(modalEl);
    }

    // Track the external emails chosen inside the open modal.
    let modalEmails = [];

    // Whom a new profile may be for: anyone without one for whoever
    // supervises, only themself for any other adult.
    function membersWithoutProfile() {
      return profileSubjects(members, profiles, ME, TENANT);
    }

    function configFormHtml(p) {
      const isNew = !p;
      const chosen = new Set(JSON.parse(p?.recipient_member_ids || "[]"));
      const subjectId = p?.member_id ?? (membersWithoutProfile()[0]?.id ?? "");
      const recipientOptions = members.filter(m => m.role === "adult" && m.id !== subjectId);
      return `
        <h2>${isNew ? "Add a check-in" : "Check-in settings"}</h2>
        <p class="hint">The person taps “I’m OK” on their own device. If they go quiet past the window, the people below are alerted.</p>
        <div class="error" data-el="error" hidden></div>
        ${isNew ? `
          <label for="cf-subject">Who is checking in</label>
          <select id="cf-subject">
            ${membersWithoutProfile().map(m => `<option value="${esc(m.id)}">${esc(m.name)}</option>`).join("")}
          </select>` : `<input type="hidden" id="cf-subject" value="${esc(subjectId)}" />`}
        <label for="cf-label">Label (optional)</label>
        <input id="cf-label" type="text" maxlength="60" value="${esc(p?.label ?? "")}" placeholder="e.g. Morning check-in" />
        <label for="cf-days">Alert if no check-in for</label>
        <div style="display:flex;align-items:center;gap:8px">
          <input id="cf-days" type="number" min="0.5" max="14" step="0.5" style="width:110px" value="${esc(String(hoursToDays(p?.interval_hours ?? 24)))}" />
          <span class="muted">day(s)</span>
        </div>
        <label for="cf-time">Agreed check-in time (optional)</label>
        <input id="cf-time" type="time" style="width:150px" value="${esc(agreedTime(p) ?? "")}" />
        <p class="hint">They get a reminder at this time each day. If there’s still no check-in ${GRACE_MINUTES} minutes later, the people below are told and can say who is following up.</p>
        <label for="cf-message">Message to include in the alert</label>
        <textarea id="cf-message" maxlength="2000" placeholder="What should they know or do? (optional)">${esc(p?.message ?? "")}</textarea>
        <label>Who gets alerted</label>
        <div data-el="recipients">
          ${recipientOptions.length
            ? recipientOptions.map(m => `<label class="recipient"><input type="checkbox" value="${esc(m.id)}" ${chosen.has(m.id) ? "checked" : ""} /> ${esc(m.name)}</label>`).join("")
            : `<p class="hint">No other adults here yet.</p>`}
        </div>
        <p class="hint">Leave everyone unchecked to alert all adults.</p>
        <label>External email contacts</label>
        <div class="ext-chips" data-el="external-list"></div>
        <div class="add-external">
          <input type="email" data-el="ext-email" placeholder="name@example.com" />
          <input type="text" data-el="ext-name" maxlength="120" placeholder="Name (optional)" />
          <button class="btn-ghost btn-sm" data-action="add-external" type="button">Invite</button>
        </div>
        <div class="picker" data-el="contacts-picker"></div>
        <p class="hint">External contacts must confirm by email before they’re ever alerted (double opt-in).</p>
        <div class="actions">
          <button class="btn" data-action="save" data-id="${esc(p?.id ?? "")}">${isNew ? "Add" : "Save"}</button>
          <span class="spacer"></span>
          <button class="btn-ghost" data-action="cancel" type="button">Cancel</button>
        </div>`;
    }

    function openConfig(p) {
      if (p ? !canManage(p) : !supervises() && membersWithoutProfile().length === 0) return;
      if (p == null && membersWithoutProfile().length === 0) {
        return flash({ err: "Everyone already has a check-in profile." });
      }
      modalEmails = JSON.parse(p?.recipient_emails || "[]").map(normalizeEmail);
      openModal(configFormHtml(p));
      renderModalEmails();
    }

    const BADGE = { confirmed: "Confirmed", pending: "Pending", unsubscribed: "Unsubscribed" };

    function renderModalEmails() {
      if (!modalEl) return;
      const list = modalEl.querySelector('[data-el="external-list"]');
      const unique = [...new Set(modalEmails.map(normalizeEmail))];
      list.innerHTML = unique.map(email => {
        const status = contactStatus(email);
        const name = contactName(email);
        const who = name ? `${esc(name)} · ${esc(email)}` : esc(email);
        return `<span class="ext-chip" data-email="${esc(email)}">
          <span class="who">${who}</span>
          ${status ? `<span class="badge ${esc(status)}">${esc(BADGE[status] ?? "Pending")}</span>` : ""}
          <button type="button" class="x" data-action="remove-external" title="Remove">×</button>
        </span>`;
      }).join("");
      const picker = modalEl.querySelector('[data-el="contacts-picker"]');
      const chosen = new Set(unique);
      const options = contactsBook.filter(c => !chosen.has(c.email)).slice(0, 12);
      picker.innerHTML = options.length
        ? `<span class="hint" style="width:100%">Quick-add from Contacts:</span>` + options.map(c =>
            `<button type="button" class="pick" data-action="pick-contact" data-email="${esc(c.email)}" data-name="${esc(c.name)}">+ ${esc(c.name || c.email)}</button>`).join("")
        : "";
    }

    function modalError(msg) {
      const el = modalEl?.querySelector('[data-el="error"]');
      if (!el) return;
      if (msg) { el.textContent = msg; el.hidden = false; } else el.hidden = true;
    }

    async function inviteExternal(email, name) {
      const norm = normalizeEmail(email);
      if (!isValidEmail(norm)) return modalError("Enter a valid email address.");
      if (modalEmails.includes(norm)) return modalError("That contact is already added.");
      if (modalEmails.length >= MAX_EXTERNAL_RECIPIENTS) return modalError(`Up to ${MAX_EXTERNAL_RECIPIENTS} external contacts.`);
      modalError(null);
      const known = externalContacts.get(norm);
      if (known?.status !== "confirmed" && XC_INVITE) {
        try {
          const res = await fetch(XC_INVITE, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: norm, name: name || undefined }) });
          if (res.status === 402) { entitled = false; return modalError("Adding external contacts needs an active plan."); }
          if (!res.ok) {
            const d = await res.json().catch(() => null);
            throw Object.assign(new Error(d?.error || `Invite failed (${res.status})`), { status: res.status, code: d?.code });
          }
          const { contact } = await res.json();
          if (contact) externalContacts.set(norm, { status: contact.status, name: contact.name || name || "" });
        } catch (e) {
          console.error("invite failed", e);
          // The refusals a person can act on keep a line of their own (inviteFailureLine).
          return modalError(inviteFailureLine(e));
        }
      } else if (name && !externalContacts.has(norm)) {
        externalContacts.set(norm, { status: "pending", name });
      }
      modalEmails = [...modalEmails, norm];
      renderModalEmails();
      return true;
    }

    const pendingProfileIds = {};
    async function saveConfig(existingId) {
      const subjectId = modalEl.querySelector("#cf-subject").value;
      if (!subjectId) return modalError("Choose who is checking in.");
      const cfg = {
        label: modalEl.querySelector("#cf-label").value.trim(),
        intervalDays: Number(modalEl.querySelector("#cf-days").value),
        message: modalEl.querySelector("#cf-message").value.trim(),
        checkinTime: modalEl.querySelector("#cf-time").value,
        recipientIds: [...modalEl.querySelectorAll('[data-el="recipients"] input:checked')].map(i => i.value),
        recipientEmails: [...modalEmails],
      };
      const err = validateConfig(cfg);
      if (err) return modalError(err);

      const btn = modalEl.querySelector('[data-action="save"]');
      if (btn) { btn.disabled = true; btn.textContent = "Saving…"; }
      const now = new Date().toISOString();
      // The three columns the agreed-time reminder reads, always written with
      // the recipients they are derived from so the two can't drift on a save.
      const timed = [checkinTimesValue(cfg.checkinTime), reminderTitle(cfg.label, memberMap.get(subjectId)?.name), timedAlertValue(cfg.recipientIds)];
      // One id per person until an Add is known to have landed: if it lands
      // and its answer is lost, the next tap meets that row and saves over it.
      const retry = !existingId && subjectId in pendingProfileIds;
      const id = existingId ?? (pendingProfileIds[subjectId] ??= crypto.randomUUID());
      const update = () => db(`UPDATE ${T}profiles SET label = ?, interval_hours = ?, message = ?, recipient_member_ids = ?, recipient_emails = ?, checkin_times = ?, reminder_title = ?, timed_alert_member_ids = ?, updated_at = ? WHERE id = ?`,
        [cfg.label, daysToHours(cfg.intervalDays), cfg.message, JSON.stringify(cfg.recipientIds), JSON.stringify(cfg.recipientEmails), ...timed, now, id]);
      try {
        if (existingId) {
          const res = await update();
          if (DB && !res.changed) {
            const found = await profileFound(id);
            const line = failureLine(null, { action: "save the check-in", thing: "check-in", found });
            // Gone: there is nothing left for this form to save.
            if (found === false) { closeModal(); return flash({ err: line }); }
            throw userError(line);
          }
        } else {
          try {
            await db(`INSERT INTO ${T}profiles (id, member_id, label, active, interval_hours, message, recipient_member_ids, recipient_emails, checkin_times, reminder_title, timed_alert_member_ids, created_at, updated_at)
                      VALUES (?, ?, ?, 0, ?, ?, ?, ?, ?, ?, ?, ?, ?)`,
              [id, subjectId, cfg.label, daysToHours(cfg.intervalDays), cfg.message, JSON.stringify(cfg.recipientIds), JSON.stringify(cfg.recipientEmails), ...timed, now, now]);
          } catch (e) {
            if (!(retry && alreadyThere(e))) throw e;
            const res = await update();
            if (DB && !res.changed) throw userError(failureLine(null, { action: "save the check-in", thing: "check-in", found: await profileFound(id) }));
          }
        }
        delete pendingProfileIds[subjectId];
        // The write has landed; a failed re-read must not report it as failed.
        // The card and the next edit then start from what was just saved.
        await loadProfiles().catch(() => {
          let p = profiles.find(x => x.id === id);
          // A new profile has to be on the board too, or the person is still
          // offered and a second Add makes a second profile.
          if (!p) profiles.push(p = { id, member_id: subjectId, active: 0, last_checkin_at: null, last_alerted_at: null, created_at: now });
          Object.assign(p, {
            label: cfg.label, interval_hours: daysToHours(cfg.intervalDays), message: cfg.message,
            recipient_member_ids: JSON.stringify(cfg.recipientIds), recipient_emails: JSON.stringify(cfg.recipientEmails),
            checkin_times: timed[0], reminder_title: timed[1], timed_alert_member_ids: timed[2], updated_at: now,
          });
        });
        closeModal();
        flash({ ok: existingId ? "Settings saved." : "Check-in added. Start monitoring when ready." });
      } catch (e) {
        // A first Add can land and its answer be lost: look before saying it
        // failed, so closing the form and starting again can't add a second.
        if (!existingId && !retry) {
          await loadProfiles().catch(() => {});
          if (profiles.some(x => x.id === id)) { delete pendingProfileIds[subjectId]; closeModal(); return flash({ ok: "Check-in added. Start monitoring when ready." }); }
        }
        if (btn) { btn.disabled = false; btn.textContent = existingId ? "Save" : "Add"; }
        modalError(failText(e, { action: "save the check-in", thing: "check-in" }));
      }
    }

    // ── events ────────────────────────────────────────────────────────────────

    document.getElementById("root").addEventListener("input", e => {
      if (e.target.id === "note-draft") noteDraft = e.target.value;
    });

    document.getElementById("root").addEventListener("click", e => {
      const btn = e.target.closest("button");
      if (!btn) return;
      if (btn.matches('[data-testid="load-retry"]')) return void firstLoad();
      if (btn.hasAttribute("data-checkin-mood")) return void doCheckIn(btn.getAttribute("data-checkin-mood"));
      if (btn.hasAttribute("data-add")) return void openConfig(null);
      if (btn.hasAttribute("data-edit")) return void openConfig(profiles.find(p => p.id === btn.getAttribute("data-edit")));
      if (btn.hasAttribute("data-arm")) return void armProfile(btn.getAttribute("data-arm"));
      if (btn.hasAttribute("data-disarm")) return void disarmProfile(btn.getAttribute("data-disarm"));
      if (btn.hasAttribute("data-delete")) return void deleteProfile(btn.getAttribute("data-delete"));
      if (btn.hasAttribute("data-req-call")) return void openCallForm();
      if (btn.hasAttribute("data-req-cancel")) return void cancelRequest(btn.getAttribute("data-req-cancel"));
      if (btn.hasAttribute("data-req-claim")) return void claimRequest(btn.getAttribute("data-req-claim"));
      if (btn.hasAttribute("data-req-claim-missed")) return void claimMissed(btn.getAttribute("data-req-claim-missed"));
      if (btn.hasAttribute("data-req-release")) return void releaseRequest(btn.getAttribute("data-req-release"));
      if (btn.hasAttribute("data-req-close")) return void openFollowUp(btn.getAttribute("data-req-close"));
    });

    document.addEventListener("click", e => {
      const btn = e.target.closest("button[data-action]");
      if (!btn || !modalEl || !modalEl.contains(btn)) return;
      const action = btn.dataset.action;
      if (action === "cancel") return closeModal();
      if (action === "save") return void saveConfig(btn.dataset.id || null);
      if (action === "send-call") return void requestCall();
      if (action === "save-follow") return void closeRequest(btn.dataset.id);
      if (action === "add-external") {
        const emailEl = modalEl.querySelector('[data-el="ext-email"]');
        const nameEl = modalEl.querySelector('[data-el="ext-name"]');
        const typed = [emailEl.value, nameEl.value];
        // Cleared only once the contact is added: a failed invite keeps what was typed.
        void inviteExternal(typed[0], typed[1].trim()).then((added) => {
          if (!added || emailEl.value !== typed[0] || nameEl.value !== typed[1]) return;
          emailEl.value = ""; nameEl.value = "";
        });
        return;
      }
      if (action === "pick-contact") return void inviteExternal(btn.dataset.email, btn.dataset.name || "");
      if (action === "remove-external") {
        const email = btn.closest(".ext-chip")?.dataset.email;
        modalEmails = modalEmails.filter(x => x !== email);
        renderModalEmails();
      }
    });

    // ── init ──────────────────────────────────────────────────────────────────

    // A board that cannot be read says so, with a way to try again: the page
    // never sits on "Loading…", and the minute tick below retries too.
    async function firstLoad() {
      let failed = false;
      await Promise.all([
        loadMembers().catch(() => { failed = true; }), refreshBoard().catch(() => { failed = true; }),
        loadEntitlement(), loadExternalContacts(), loadContactsBook(),
      ]);
      loadFailed = failed;
      if (!ME && !CONTEXT) ME = members[0] ?? null; // demo mode: act as the first member
      render();
    }

    (async function init() {
      await firstLoad();
      // Every minute: re-read the board, then redraw (which also keeps the
      // countdowns fresh). Unconditionally — an empty board is exactly the one
      // that has to notice a call request arriving, and a relative with the app
      // open should not have to reload to see it. Paused only while the tab is
      // hidden, and caught up the moment it is shown again.
      let refreshing = false;
      const tick = async () => {
        if (modalEl || refreshing) return;
        refreshing = true;
        // A failed first load is retried whole: the board alone answering does
        // not make the member list known.
        if (loadFailed) { await firstLoad(); refreshing = false; return; }
        try {
          await refreshBoard();
        } catch { /* offline: redraw what we have */ }
        refreshing = false;
        if (!modalEl) render();
      };
      setInterval(() => { if (!document.hidden) tick(); }, 60_000);
      document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
    })();
  </script>
</body>
</html>
