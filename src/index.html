<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <base href="/run/wellness-check-in/" />
  <title>Wellness Check-In</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: var(--hub-bg, #f9fafb);
      --surface: var(--hub-surface, #ffffff);
      --border: var(--hub-border, #e5e7eb);
      --border-mid: var(--hub-border, #d1d5db);
      --text: var(--hub-text, #111827);
      --muted: var(--hub-text-muted, #6b7280);
      --accent: var(--hub-primary, #be185d);
      --accent-hover: var(--hub-primary-hover, #9d174d);
      --accent-fg: var(--hub-primary-fg, #ffffff);
      --radius: var(--hub-radius, 12px);
      --green: #047857; --green-soft: #d1fae5;
      --amber: #b45309; --amber-soft: #fef3c7;
      --red: #b91c1c;   --red-soft: #fee2e2;
      --indigo: #4338ca; --indigo-soft: #e0e7ff;
      --shadow: 0 1px 3px rgba(15,23,42,.07);
    }
    body {
      min-height: 100vh; background: var(--bg); color: var(--text);
      font-family: var(--hub-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      font-size: var(--hub-font-size, 15px); line-height: 1.5;
    }
    .app { max-width: 720px; margin: 0 auto; padding: 16px 20px 48px; }
    .header h1 { font-size: 1.3rem; }
    .header .subtitle { color: var(--muted); font-size: .85rem; margin-top: 2px; }
    .muted { color: var(--muted); }
    .tiny { font-size: .78rem; }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 14px;
    }
    .banner { border-radius: var(--radius); padding: 14px 16px; margin: 14px 0; font-size: .9rem; line-height: 1.5; }
    .banner.buy { background: var(--indigo-soft); border: 1px solid #c7d2fe; color: #3730a3; }
    .self-card { border-color: #fbcfe8; background: linear-gradient(180deg, #fff, #fff5f9); }
    .self-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .self-head .title { font-weight: 750; font-size: 1.05rem; }
    .mood-row { display: flex; gap: 10px; margin-top: 12px; flex-wrap: wrap; }
    .mood-btn {
      flex: 1; min-width: 96px; display: flex; flex-direction: column; align-items: center; gap: 4px;
      border: 1.5px solid var(--border-mid); border-radius: var(--radius); background: var(--surface);
      color: var(--text); padding: 12px 8px; cursor: pointer; font: inherit; font-weight: 650;
    }
    .mood-btn .emoji { font-size: 1.6rem; }
    .mood-btn:hover { border-color: var(--accent); }
    .mood-btn:disabled { opacity: .5; cursor: default; }
    .note-input { margin-top: 12px; }
    .status-row { display: flex; align-items: center; gap: 12px; }
    .dot { width: 13px; height: 13px; border-radius: 50%; flex-shrink: 0; }
    .dot.disarmed { background: #9ca3af; }
    .dot.ok { background: #10b981; }
    .dot.due_soon { background: #f59e0b; }
    .dot.overdue { background: #ef4444; }
    .dot.unstarted { background: #6366f1; }
    .board-card { }
    .board-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .board-title { font-weight: 750; }
    .board-meta { color: var(--muted); font-size: .84rem; margin-top: 2px; }
    .pill { display: inline-flex; align-items: center; min-height: 24px; padding: 2px 10px; border-radius: 999px;
      background: #f1f5f9; color: var(--muted); font-size: .74rem; font-weight: 700; white-space: nowrap; }
    .pill.good { background: var(--green-soft); color: var(--green); }
    .pill.warn { background: var(--amber-soft); color: var(--amber); }
    .pill.bad { background: var(--red-soft); color: var(--red); }
    .pill.info { background: var(--indigo-soft); color: var(--indigo); }
    .streak { margin-top: 10px; font-size: .85rem; }
    .history { margin-top: 10px; display: grid; gap: 6px; }
    .h-item { display: flex; align-items: center; gap: 8px; font-size: .82rem; color: var(--text); }
    .h-item .h-emoji { font-size: 1rem; }
    .h-item .h-when { color: var(--muted); margin-left: auto; white-space: nowrap; }
    .row-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    button {
      font: inherit; border: 1px solid transparent; border-radius: 8px; padding: 9px 14px;
      cursor: pointer; font-weight: 700; min-height: 38px;
    }
    button:disabled { opacity: .5; cursor: default; }
    .btn { background: var(--accent); color: var(--accent-fg); }
    .btn:hover { background: var(--accent-hover); }
    .btn-checkin { background: #10b981; color: #fff; }
    .btn-ghost { background: transparent; color: var(--text); border-color: var(--border-mid); }
    .btn-ghost:hover { background: #f8fafc; }
    .btn-danger { background: var(--red-soft); color: var(--red); }
    .btn-sm { min-height: 32px; padding: 5px 10px; font-size: .8rem; }
    label { display: block; font-size: .76rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 800; margin: 12px 0 5px; }
    input, textarea, select {
      width: 100%; border: 1.5px solid var(--border-mid); border-radius: 8px;
      padding: 9px 11px; font: inherit; background: var(--surface); color: var(--text);
    }
    textarea { min-height: 72px; resize: vertical; }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }
    .recipient { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: .92rem; text-transform: none; letter-spacing: normal; }
    .recipient input { width: 16px; height: 16px; }
    .ext-chips { display: flex; flex-wrap: wrap; gap: 8px; margin: 4px 0; }
    .ext-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--bg);
      border: 1px solid var(--border); border-radius: 999px; padding: 4px 6px 4px 12px; font-size: .84rem; max-width: 100%; }
    .ext-chip .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ext-chip .badge { font-size: .66rem; font-weight: 700; text-transform: uppercase; padding: 2px 6px; border-radius: 999px; }
    .ext-chip .badge.confirmed { background: var(--green-soft); color: #065f46; }
    .ext-chip .badge.pending { background: var(--amber-soft); color: #92400e; }
    .ext-chip .badge.unsubscribed { background: var(--red-soft); color: #991b1b; }
    .ext-chip .x { background: transparent; border: none; padding: 0 2px; min-height: auto; cursor: pointer; color: var(--muted); font-size: 1rem; font-weight: 700; }
    .add-external { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
    .add-external input[type="email"] { flex: 2; min-width: 150px; }
    .add-external input[type="text"] { flex: 1; min-width: 100px; }
    .picker { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
    .picker .pick { background: transparent; border: 1px dashed var(--border-mid); border-radius: 999px; padding: 4px 12px; min-height: auto; font-size: .82rem; font-weight: 500; color: var(--text); }
    .modal-backdrop { position: fixed; inset: 0; background: rgba(15,23,42,.45); display: flex; align-items: flex-start; justify-content: center; padding: 24px 14px; overflow-y: auto; z-index: 50; }
    .modal { background: var(--surface); border-radius: var(--radius); box-shadow: 0 20px 50px rgba(15,23,42,.25); padding: 20px; width: 100%; max-width: 520px; }
    .modal h2 { font-size: 1.1rem; margin-bottom: 4px; }
    .actions { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; }
    .actions .spacer { flex: 1; }
    .hint { font-size: .8rem; color: var(--muted); margin-top: 4px; }
    .error { background: var(--red-soft); color: var(--red); padding: 9px 12px; border-radius: 8px; margin: 8px 0; font-size: .86rem; }
    .notice { background: var(--green-soft); color: var(--green); padding: 9px 12px; border-radius: 8px; margin: 8px 0; font-size: .86rem; }
    .empty { text-align: center; color: var(--muted); padding: 26px 14px; }
    .footnote { color: var(--muted); font-size: .8rem; margin-top: 18px; }
    @media (max-width: 520px) { .mood-btn { min-width: 0; } }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <h1>💗 Wellness Check-In</h1>
      <p class="subtitle">A gentle daily “I’m OK”. If a check-in is missed, the care circle gets an alert.</p>
    </div>
    <div id="root"><div class="empty">Loading…</div></div>
  </div>

  <script type="module">
    import { esc, isAdult, memberColor, initial, hubAlert, hubConfirm } from "/hub-sdk.js";
    import {
      MOODS, moodMeta, hoursToDays, daysToHours, intervalLabel, profileStatus,
      formatRemaining, computeStreak, validateConfig, recipientsSummary, profileTitle,
      normalizeEmail, isValidEmail, MAX_PROFILES, MAX_EXTERNAL_RECIPIENTS,
    } from "./logic.js";

    const T = "app_wellness_check_in__";
    const DB = window.__DB_URL ?? "";
    const CONTEXT = window.__CONTEXT_URL ?? "";
    const APP_ID = window.__APP_ID ?? "wellness-check-in";
    let ME = window.__CURRENT_MEMBER ?? null; // falls back to a demo member when there's no hub context
    const CHECK_IN = `/run/${APP_ID}/api/check-in`;
    const XC_INVITE = window.__EXTERNAL_CONTACTS_INVITE_URL ?? "";
    const XC_LIST = window.__EXTERNAL_CONTACTS_LIST_URL ?? "";

    let members = [];
    let memberMap = new Map();
    let profiles = [];
    let checkins = [];               // rows visible to me (owner + adults see all)
    let entitled = null;             // null until the endpoint answers
    let externalContacts = new Map();// normalized email → { status, name }
    let contactsBook = [];           // [{name, email}] quick-adds from contacts app
    let error = "";
    let notice = "";
    let noteDraft = "";

    const iAmAdult = () => isAdult(ME, members);
    const IS_ADMIN  = window.__IS_ADMIN === true;
    const IS_ROSTER = window.__SPACE_KIND === "roster";
    // Who sets up and manages the monitored profiles. In a roster (a care
    // coordinator's client list) that's the steward alone; each member only
    // checks in for themselves. Elsewhere any adult in the care circle manages.
    // Matches the hub profiles policy (adult_writable + member_read_column +
    // steward_writes_only). Checking in is never gated — that's every member's.
    const canSteward = () => IS_ROSTER ? IS_ADMIN : iAmAdult();

    async function db(sql, params = []) {
      if (!DB) return { rows: [] };
      const res = await fetch(DB, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sql, params }),
      });
      const json = await res.json();
      if (json.error) throw new Error(json.error);
      return json;
    }

    // ── loading ───────────────────────────────────────────────────────────────

    async function loadMembers() {
      if (!CONTEXT) {
        members = [
          { id: "demo-1", name: "Grandpa Joe", role: "adult" },
          { id: "demo-2", name: "Maria", role: "adult" },
          { id: "demo-3", name: "Dev", role: "adult" },
        ];
      } else {
        try {
          const res = await fetch(`${CONTEXT}?keys=family.members`);
          members = ((await res.json())["family.members"]) ?? [];
        } catch { members = []; }
      }
      memberMap = new Map(members.map(m => [m.id, m]));
    }

    async function loadProfiles() {
      if (!DB) {
        profiles = [{
          id: "demo-p1", member_id: "demo-1", label: "", active: 1, interval_hours: 24,
          message: "Please call me and swing by the house.", recipient_member_ids: "[]",
          recipient_emails: "[]", last_checkin_at: new Date(Date.now() - 20 * 3600 * 1000).toISOString(),
          last_alerted_at: null, created_at: new Date().toISOString(), updated_at: new Date().toISOString(),
        }];
        return;
      }
      const { rows } = await db(`SELECT * FROM ${T}profiles ORDER BY created_at ASC`);
      profiles = rows ?? [];
    }

    async function loadCheckins() {
      if (!DB) {
        const now = Date.now();
        checkins = [
          { id: "c1", member_id: "demo-1", mood: "good", note: "Slept well.", checked_at: new Date(now - 20 * 3600 * 1000).toISOString() },
          { id: "c2", member_id: "demo-1", mood: "ok", note: "", checked_at: new Date(now - 44 * 3600 * 1000).toISOString() },
        ];
        return;
      }
      const { rows } = await db(`SELECT * FROM ${T}checkins ORDER BY checked_at DESC LIMIT 200`);
      checkins = rows ?? [];
    }

    async function loadEntitlement() {
      try {
        const res = await fetch(CHECK_IN);
        if (!res.ok) { entitled = null; return; }
        entitled = !!(await res.json()).entitled;
      } catch { entitled = null; }
    }

    async function loadExternalContacts() {
      externalContacts = new Map();
      if (!XC_LIST) return;
      try {
        const res = await fetch(XC_LIST, { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
        if (!res.ok) return;
        const { contacts } = await res.json();
        for (const c of contacts ?? []) externalContacts.set(normalizeEmail(c.email), { status: c.status, name: c.name || "" });
      } catch { /* leave empty */ }
    }

    async function loadContactsBook() {
      contactsBook = [];
      try {
        const res = await fetch(`${CONTEXT}?keys=app.contacts.contact_emails`);
        const list = (await res.json())["app.contacts.contact_emails"];
        if (Array.isArray(list)) {
          contactsBook = list.filter(c => c && isValidEmail(c.email))
            .map(c => ({ name: String(c.name || "").trim(), email: normalizeEmail(c.email) }));
        }
      } catch { contactsBook = []; }
    }

    // ── derived ─────────────────────────────────────────────────────────────

    function memberName(id) { return memberMap.get(id)?.name ?? "Someone"; }
    function myProfile() { return profiles.find(p => p.member_id === ME?.id) ?? null; }
    function checkinsFor(memberId) { return checkins.filter(c => c.member_id === memberId); }
    function contactStatus(email) { return externalContacts.get(normalizeEmail(email))?.status ?? "pending"; }
    function contactName(email) {
      const norm = normalizeEmail(email);
      return externalContacts.get(norm)?.name || contactsBook.find(c => c.email === norm)?.name || "";
    }
    function fmtAgo(iso) {
      if (!iso) return "never";
      const ms = Date.now() - Date.parse(iso);
      if (Number.isNaN(ms)) return "never";
      if (ms < 60000) return "just now";
      return `${formatRemaining(ms)} ago`;
    }

    // ── rendering ─────────────────────────────────────────────────────────────

    const STATE_PILL = {
      ok: ["good", "On track"], due_soon: ["warn", "Due soon"], overdue: ["bad", "Overdue"],
      unstarted: ["info", "Waiting for first check-in"], disarmed: ["", "Paused"],
    };

    function renderMessages() {
      return `${error ? `<div class="error">${esc(error)}</div>` : ""}${notice ? `<div class="notice">${esc(notice)}</div>` : ""}`;
    }

    function renderBanner() {
      if (entitled !== false) return "";
      return `<div class="banner buy">🔒 <strong>Monitoring isn’t active for your household yet.</strong>
        Setting up profiles is free, but the hub-side monitoring and alert emails are part of the
        <strong>Premium</strong> capability bundle. A household admin can upgrade from
        <strong>Apps → Marketplace</strong>.</div>`;
    }

    function renderSelfCard() {
      const p = myProfile();
      if (!p) return "";
      const status = profileStatus(p);
      const streak = computeStreak(checkinsFor(ME.id));
      const [cls, label] = STATE_PILL[status.state] ?? ["", ""];
      const disabled = entitled === false;
      return `
        <div class="card self-card">
          <div class="self-head">
            <div class="title">Your check-in</div>
            <span class="pill ${cls}">${esc(label)}</span>
          </div>
          <p class="board-meta">${statusDetail(p, status)}</p>
          ${streak > 0 ? `<div class="streak">🔥 <strong>${streak}-day</strong> streak — keep it going.</div>` : ""}
          <div class="mood-row">
            ${MOODS.map(m => `
              <button class="mood-btn" data-checkin-mood="${esc(m.key)}" ${disabled ? "disabled" : ""}>
                <span class="emoji">${esc(m.emoji)}</span>${esc(m.label)}
              </button>`).join("")}
          </div>
          <div class="note-input">
            <textarea id="note-draft" maxlength="500" placeholder="Add a note for your care circle (optional)">${esc(noteDraft)}</textarea>
          </div>
          <p class="hint">One tap resets your clock and lets everyone know you’re OK.</p>
        </div>`;
    }

    function statusDetail(p, status) {
      const who = recipientsSummary(JSON.parse(p.recipient_member_ids || "[]"), members, p.member_id, JSON.parse(p.recipient_emails || "[]"));
      if (status.state === "disarmed") return "Monitoring is paused.";
      if (status.state === "unstarted") return `Monitoring is on (${esc(intervalLabel(p.interval_hours))}) — waiting for the first check-in.`;
      if (status.state === "overdue") return `No check-in for ${esc(formatRemaining(status.overdueMs + p.interval_hours * 3600 * 1000))}. Alerts go to ${esc(who)}.`;
      return `Next check-in due in ${esc(formatRemaining(status.remainingMs))} (${esc(intervalLabel(p.interval_hours))}). Alerts go to ${esc(who)}.`;
    }

    function renderBoardCard(p) {
      const status = profileStatus(p);
      const [cls, label] = STATE_PILL[status.state] ?? ["", ""];
      const streak = computeStreak(checkinsFor(p.member_id));
      const recent = checkinsFor(p.member_id).slice(0, 3);
      const canManage = canSteward();
      const isSelf = p.member_id === ME?.id;
      return `
        <div class="card board-card" data-pid="${esc(p.id)}">
          <div class="board-head">
            <div>
              <div class="board-title">${esc(profileTitle(p, members))}</div>
              <div class="board-meta">${esc(isSelf ? "You" : memberName(p.member_id))} · last check-in ${esc(fmtAgo(p.last_checkin_at))}</div>
            </div>
            <span class="pill ${cls}">${esc(label)}</span>
          </div>
          ${streak > 0 ? `<div class="streak">🔥 ${streak}-day streak</div>` : ""}
          ${recent.length ? `<div class="history">${recent.map(renderHistoryItem).join("")}</div>` : `<p class="board-meta" style="margin-top:8px">No check-ins logged yet.</p>`}
          ${canManage ? `
            <div class="row-actions">
              <button class="btn-ghost btn-sm" data-edit="${esc(p.id)}">Settings</button>
              ${Number(p.active) === 1
                ? `<button class="btn-ghost btn-sm" data-disarm="${esc(p.id)}">Pause</button>`
                : `<button class="btn btn-sm" data-arm="${esc(p.id)}">Start monitoring</button>`}
              <button class="btn-danger btn-sm" data-delete="${esc(p.id)}">Delete</button>
            </div>` : ""}
        </div>`;
    }

    function renderHistoryItem(c) {
      const m = moodMeta(c.mood);
      return `<div class="h-item">
        <span class="h-emoji">${esc(m ? m.emoji : "✓")}</span>
        <span>${c.note ? esc(c.note) : esc(m ? m.label : "Checked in")}</span>
        <span class="h-when">${esc(fmtAgo(c.checked_at))}</span>
      </div>`;
    }

    function render() {
      const root = document.getElementById("root");
      if (!ME) { root.innerHTML = `<div class="card empty">Sign in to use Wellness Check-In.</div>`; return; }
      const others = profiles;
      root.innerHTML = `
        ${renderBanner()}
        ${renderMessages()}
        ${renderSelfCard()}
        <div class="board-head" style="margin: 6px 2px 10px">
          <h2 style="font-size:1rem">Care circle</h2>
          ${canSteward() ? `<button class="btn btn-sm" data-add ${profiles.length >= MAX_PROFILES ? "disabled" : ""}>+ Add someone</button>` : ""}
        </div>
        ${others.length ? others.map(renderBoardCard).join("") : `<div class="card empty">No check-in profiles yet.${canSteward() ? " Add someone to start." : ""}</div>`}
        <p class="footnote">Alerts are emailed to household members and to external contacts who confirmed by email (double opt-in).
          Monitoring runs on the hub’s servers — it works even when nobody has the app open.</p>`;
    }

    function flash({ err = "", ok = "" } = {}) { error = err; notice = ok; render(); }

    // ── check-in ────────────────────────────────────────────────────────────

    async function doCheckIn(mood) {
      const p = myProfile();
      if (!p) return;
      const note = (document.getElementById("note-draft")?.value ?? "").trim();
      // 1. Authoritative: stamp last_checkin_at on all of my profiles via the hub.
      let res;
      try {
        res = await fetch(CHECK_IN, { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
      } catch { return flash({ err: "Couldn’t reach the check-in service. Try again." }); }
      if (res.status === 402) { entitled = false; return flash({ err: "Monitoring needs the Premium bundle — ask an admin to upgrade." }); }
      if (!res.ok) {
        const data = await res.json().catch(() => ({}));
        return flash({ err: data.error ?? "Check-in failed." });
      }
      entitled = true;
      // 2. Optimistically reflect the check-in locally — the hub already reset the
      //    timer, so patch state instead of round-tripping the whole board.
      const now = new Date().toISOString();
      const idx = profiles.findIndex(x => x.id === p.id);
      if (idx !== -1) profiles[idx] = { ...profiles[idx], last_checkin_at: now };
      const row = { id: crypto.randomUUID(), member_id: ME.id, mood, note, checked_at: now };
      checkins = [row, ...checkins];
      noteDraft = "";
      flash({ ok: "Checked in — thanks for letting everyone know." });
      // 3. Persist the display-only history row (owner_only forces member_id to me).
      if (DB) {
        db(`INSERT INTO ${T}checkins (id, member_id, mood, note, checked_at) VALUES (?, ?, ?, ?, ?)`,
          [row.id, row.member_id, row.mood, row.note, row.checked_at])
          .catch(() => {}); // best-effort; the authoritative timer already reset
      }
    }

    // ── arm / disarm / delete ─────────────────────────────────────────────────

    async function armProfile(id) {
      if (!canSteward()) return;
      if (entitled === false) return flash({ err: "Monitoring needs the Premium bundle — ask an admin to upgrade." });
      try {
        await db(`UPDATE ${T}profiles SET active = 1, updated_at = ? WHERE id = ?`, [new Date().toISOString(), id]);
        await loadProfiles();
        flash({ ok: "Monitoring started. The clock begins at the first check-in." });
      } catch (e) { flash({ err: e.message }); }
    }

    async function disarmProfile(id) {
      if (!canSteward()) return;
      try {
        await db(`UPDATE ${T}profiles SET active = 0, updated_at = ? WHERE id = ?`, [new Date().toISOString(), id]);
        await loadProfiles();
        flash({ ok: "Monitoring paused." });
      } catch (e) { flash({ err: e.message }); }
    }

    async function deleteProfile(id) {
      if (!canSteward()) return;
      const p = profiles.find(x => x.id === id);
      if (!(await hubConfirm({ message: `Delete ${profileTitle(p, members)}?`, description: "Monitoring stops immediately. Check-in history is kept.", confirmLabel: "Delete", destructive: true }))) return;
      try {
        await db(`DELETE FROM ${T}profiles WHERE id = ?`, [id]);
        await loadProfiles();
        flash({ ok: "Profile deleted." });
      } catch (e) { flash({ err: e.message }); }
    }

    // ── config modal (add / edit) ─────────────────────────────────────────────

    let modalEl = null;
    function closeModal() { modalEl?.remove(); modalEl = null; }
    function openModal(html) {
      closeModal();
      modalEl = document.createElement("div");
      modalEl.className = "modal-backdrop";
      modalEl.innerHTML = `<div class="modal">${html}</div>`;
      modalEl.addEventListener("click", e => { if (e.target === modalEl) closeModal(); });
      document.body.appendChild(modalEl);
    }

    // Track the external emails chosen inside the open modal.
    let modalEmails = [];

    function membersWithoutProfile() {
      const taken = new Set(profiles.map(p => p.member_id));
      return members.filter(m => !taken.has(m.id));
    }

    function configFormHtml(p) {
      const isNew = !p;
      const chosen = new Set(JSON.parse(p?.recipient_member_ids || "[]"));
      const subjectId = p?.member_id ?? (membersWithoutProfile()[0]?.id ?? "");
      const recipientOptions = members.filter(m => m.role === "adult" && m.id !== subjectId);
      return `
        <h2>${isNew ? "Add a check-in" : "Check-in settings"}</h2>
        <p class="hint">The person taps “I’m OK” on their own device. If they go quiet past the window, the people below are alerted.</p>
        <div class="error" data-el="error" hidden></div>
        ${isNew ? `
          <label for="cf-subject">Who is checking in</label>
          <select id="cf-subject">
            ${membersWithoutProfile().map(m => `<option value="${esc(m.id)}">${esc(m.name)}</option>`).join("")}
          </select>` : `<input type="hidden" id="cf-subject" value="${esc(subjectId)}" />`}
        <label for="cf-label">Label (optional)</label>
        <input id="cf-label" type="text" maxlength="60" value="${esc(p?.label ?? "")}" placeholder="e.g. Morning check-in" />
        <label for="cf-days">Alert if no check-in for</label>
        <div style="display:flex;align-items:center;gap:8px">
          <input id="cf-days" type="number" min="0.5" max="14" step="0.5" style="width:110px" value="${esc(String(hoursToDays(p?.interval_hours ?? 24)))}" />
          <span class="muted">day(s)</span>
        </div>
        <label for="cf-message">Message to include in the alert</label>
        <textarea id="cf-message" maxlength="2000" placeholder="What should they know or do? (optional)">${esc(p?.message ?? "")}</textarea>
        <label>Who gets alerted</label>
        <div data-el="recipients">
          ${recipientOptions.length
            ? recipientOptions.map(m => `<label class="recipient"><input type="checkbox" value="${esc(m.id)}" ${chosen.has(m.id) ? "checked" : ""} /> ${esc(m.name)}</label>`).join("")
            : `<p class="hint">No other adults in the household yet.</p>`}
        </div>
        <p class="hint">Leave everyone unchecked to alert all adults in the household.</p>
        <label>External email contacts</label>
        <div class="ext-chips" data-el="external-list"></div>
        <div class="add-external">
          <input type="email" data-el="ext-email" placeholder="name@example.com" />
          <input type="text" data-el="ext-name" maxlength="120" placeholder="Name (optional)" />
          <button class="btn-ghost btn-sm" data-action="add-external" type="button">Invite</button>
        </div>
        <div class="picker" data-el="contacts-picker"></div>
        <p class="hint">External contacts must confirm by email before they’re ever alerted (double opt-in).</p>
        <div class="actions">
          <button class="btn" data-action="save" data-id="${esc(p?.id ?? "")}">${isNew ? "Add" : "Save"}</button>
          <span class="spacer"></span>
          <button class="btn-ghost" data-action="cancel" type="button">Cancel</button>
        </div>`;
    }

    function openConfig(p) {
      if (!canSteward()) return;
      if (p == null && membersWithoutProfile().length === 0) {
        return flash({ err: "Everyone already has a check-in profile." });
      }
      modalEmails = JSON.parse(p?.recipient_emails || "[]").map(normalizeEmail);
      openModal(configFormHtml(p));
      renderModalEmails();
    }

    const BADGE = { confirmed: "Confirmed", pending: "Pending", unsubscribed: "Unsubscribed" };

    function renderModalEmails() {
      if (!modalEl) return;
      const list = modalEl.querySelector('[data-el="external-list"]');
      const unique = [...new Set(modalEmails.map(normalizeEmail))];
      list.innerHTML = unique.map(email => {
        const status = contactStatus(email);
        const name = contactName(email);
        const who = name ? `${esc(name)} · ${esc(email)}` : esc(email);
        return `<span class="ext-chip" data-email="${esc(email)}">
          <span class="who">${who}</span>
          <span class="badge ${esc(status)}">${esc(BADGE[status] ?? "Pending")}</span>
          <button type="button" class="x" data-action="remove-external" title="Remove">×</button>
        </span>`;
      }).join("");
      const picker = modalEl.querySelector('[data-el="contacts-picker"]');
      const chosen = new Set(unique);
      const options = contactsBook.filter(c => !chosen.has(c.email)).slice(0, 12);
      picker.innerHTML = options.length
        ? `<span class="hint" style="width:100%">Quick-add from Contacts:</span>` + options.map(c =>
            `<button type="button" class="pick" data-action="pick-contact" data-email="${esc(c.email)}" data-name="${esc(c.name)}">+ ${esc(c.name || c.email)}</button>`).join("")
        : "";
    }

    function modalError(msg) {
      const el = modalEl?.querySelector('[data-el="error"]');
      if (!el) return;
      if (msg) { el.textContent = msg; el.hidden = false; } else el.hidden = true;
    }

    async function inviteExternal(email, name) {
      const norm = normalizeEmail(email);
      if (!isValidEmail(norm)) return modalError("Enter a valid email address.");
      if (modalEmails.includes(norm)) return modalError("That contact is already added.");
      if (modalEmails.length >= MAX_EXTERNAL_RECIPIENTS) return modalError(`Up to ${MAX_EXTERNAL_RECIPIENTS} external contacts.`);
      modalError(null);
      const known = externalContacts.get(norm);
      if (known?.status !== "confirmed" && XC_INVITE) {
        try {
          const res = await fetch(XC_INVITE, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: norm, name: name || undefined }) });
          if (res.status === 402) { entitled = false; return modalError("Adding external contacts needs the Premium bundle."); }
          if (!res.ok) { const d = await res.json().catch(() => ({})); return modalError(d.error ?? "Couldn’t send the confirmation email."); }
          const { contact } = await res.json();
          if (contact) externalContacts.set(norm, { status: contact.status, name: contact.name || name || "" });
        } catch { return modalError("Couldn’t send the confirmation email."); }
      } else if (name && !externalContacts.has(norm)) {
        externalContacts.set(norm, { status: "pending", name });
      }
      modalEmails = [...modalEmails, norm];
      renderModalEmails();
    }

    async function saveConfig(existingId) {
      const subjectId = modalEl.querySelector("#cf-subject").value;
      if (!subjectId) return modalError("Choose who is checking in.");
      const cfg = {
        label: modalEl.querySelector("#cf-label").value.trim(),
        intervalDays: Number(modalEl.querySelector("#cf-days").value),
        message: modalEl.querySelector("#cf-message").value.trim(),
        recipientIds: [...modalEl.querySelectorAll('[data-el="recipients"] input:checked')].map(i => i.value),
        recipientEmails: [...modalEmails],
      };
      const err = validateConfig(cfg);
      if (err) return modalError(err);

      const btn = modalEl.querySelector('[data-action="save"]');
      if (btn) { btn.disabled = true; btn.textContent = "Saving…"; }
      const now = new Date().toISOString();
      try {
        if (existingId) {
          await db(`UPDATE ${T}profiles SET label = ?, interval_hours = ?, message = ?, recipient_member_ids = ?, recipient_emails = ?, updated_at = ? WHERE id = ?`,
            [cfg.label, daysToHours(cfg.intervalDays), cfg.message, JSON.stringify(cfg.recipientIds), JSON.stringify(cfg.recipientEmails), now, existingId]);
        } else {
          const id = crypto.randomUUID();
          await db(`INSERT INTO ${T}profiles (id, member_id, label, active, interval_hours, message, recipient_member_ids, recipient_emails, created_at, updated_at)
                    VALUES (?, ?, ?, 0, ?, ?, ?, ?, ?, ?)`,
            [id, subjectId, cfg.label, daysToHours(cfg.intervalDays), cfg.message, JSON.stringify(cfg.recipientIds), JSON.stringify(cfg.recipientEmails), now, now]);
        }
        await loadProfiles();
        closeModal();
        flash({ ok: existingId ? "Settings saved." : "Check-in added. Start monitoring when ready." });
      } catch (e) {
        if (btn) { btn.disabled = false; btn.textContent = existingId ? "Save" : "Add"; }
        modalError(e.message);
      }
    }

    // ── events ────────────────────────────────────────────────────────────────

    document.getElementById("root").addEventListener("input", e => {
      if (e.target.id === "note-draft") noteDraft = e.target.value;
    });

    document.getElementById("root").addEventListener("click", e => {
      const btn = e.target.closest("button");
      if (!btn) return;
      if (btn.hasAttribute("data-checkin-mood")) return void doCheckIn(btn.getAttribute("data-checkin-mood"));
      if (btn.hasAttribute("data-add")) return void openConfig(null);
      if (btn.hasAttribute("data-edit")) return void openConfig(profiles.find(p => p.id === btn.getAttribute("data-edit")));
      if (btn.hasAttribute("data-arm")) return void armProfile(btn.getAttribute("data-arm"));
      if (btn.hasAttribute("data-disarm")) return void disarmProfile(btn.getAttribute("data-disarm"));
      if (btn.hasAttribute("data-delete")) return void deleteProfile(btn.getAttribute("data-delete"));
    });

    document.addEventListener("click", e => {
      const btn = e.target.closest("button[data-action]");
      if (!btn || !modalEl || !modalEl.contains(btn)) return;
      const action = btn.dataset.action;
      if (action === "cancel") return closeModal();
      if (action === "save") return void saveConfig(btn.dataset.id || null);
      if (action === "add-external") {
        const emailEl = modalEl.querySelector('[data-el="ext-email"]');
        const nameEl = modalEl.querySelector('[data-el="ext-name"]');
        inviteExternal(emailEl.value, nameEl.value.trim());
        emailEl.value = ""; nameEl.value = "";
        return;
      }
      if (action === "pick-contact") return void inviteExternal(btn.dataset.email, btn.dataset.name || "");
      if (action === "remove-external") {
        const email = btn.closest(".ext-chip")?.dataset.email;
        modalEmails = modalEmails.filter(x => x !== email);
        renderModalEmails();
      }
    });

    // ── init ──────────────────────────────────────────────────────────────────

    (async function init() {
      await Promise.all([loadMembers(), loadProfiles(), loadCheckins(), loadEntitlement(), loadExternalContacts(), loadContactsBook()]);
      if (!ME && !CONTEXT) ME = members[0] ?? null; // demo mode: act as the first member
      render();
      setInterval(() => { if (!modalEl) render(); }, 60_000); // keep countdowns fresh
    })();
  </script>
</body>
</html>
